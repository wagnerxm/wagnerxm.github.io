<title>Página não encontrada</title>
<script>
  /* ControlCheck (aplicativo de uma página só, em /controlcheck/ desde 26/11/2026): os links internos (ex.: /controlcheck/contratos) chegam aqui;
     devolve para o app com a rota na URL, como o 404.html dele fazia */
  (function(){ var novo='/controlcheck', velho='/kmcheck/controlmed', p=location.pathname;
    /* endereço antigo (dentro do site do KM Check até 26/11/2026): leva para o novo, mantendo a rota */
    if(p.indexOf(velho+'/')===0) p=novo+p.slice(velho.length);
    if(p.indexOf(novo+'/')===0){ var seg=p.slice(novo.length).split('/').filter(Boolean); location.replace(novo+'/'+(seg.length?'?/'+seg.join('/'):'')+location.hash) }
  })();
</script>
